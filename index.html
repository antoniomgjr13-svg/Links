<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antônio Magnago Junior · Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#070a14; --card:#0e1226; --line:#232a4d; --text:#f2f4ff; --muted:#8b93b8;
  --blue:#5b7cff; --green:#22c55e;
  --sans:"Inter Tight",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  background-image:radial-gradient(circle,#1b2244 1px,transparent 1.5px);
  background-size:26px 26px;
}
main{max-width:520px; margin:0 auto; padding:20px 16px 36px; display:grid; gap:14px}
.card{background:var(--card); border:1px solid var(--line); border-radius:26px}
.hero{padding:30px 24px 26px}
h1{margin:0; font-size:clamp(38px,11.5vw,60px); line-height:.95; letter-spacing:-.04em; font-weight:800}
h1 span{color:var(--blue); display:block}
.role{margin:22px 0 0; font-family:var(--mono); font-size:17px; min-height:1.4em}
.cursor{display:inline-block; width:10px; height:1.05em; background:var(--blue); vertical-align:-.15em; margin-left:3px; animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.row{display:grid; grid-template-columns:1fr; gap:14px}
.photo{display:grid; place-items:center; padding:22px}
.avatar{
  width:96px; height:96px; border-radius:50%; display:grid; place-items:center;
  font-size:34px; font-weight:800; background:#141a38; color:var(--blue);
  outline:2px dashed var(--blue); outline-offset:6px; overflow:hidden;
}
.avatar img{width:100%; height:100%; object-fit:cover}
.status{padding:20px}
.tag{font-family:var(--mono); font-size:13px; color:var(--muted)}
.online{display:flex; align-items:center; gap:10px; margin:14px 0 16px; font-size:26px; font-weight:700; color:var(--green)}
.dot{width:14px; height:14px; border-radius:50%; background:var(--green); animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #22c55e88}50%{box-shadow:0 0 0 10px #22c55e00}}
.bars{display:flex; align-items:flex-end; gap:6px; height:36px; border-top:4px solid var(--blue); padding-top:12px}
.bars i{flex:1; background:var(--blue); border-radius:3px; height:5px; transition:height .45s ease}
.bars i.t{height:36px;border-radius:3px}.bars i.m{height:20px;border-radius:3px}
h2{margin:10px 4px 0; font:400 14px var(--mono); color:var(--muted); letter-spacing:.08em}
.links{display:grid; gap:12px}
a.link{
  display:flex; align-items:center; gap:16px; padding:16px; color:inherit; text-decoration:none;
  transition:border-color .2s, transform .2s;
}
a.link:hover,a.link:focus-visible{border-color:var(--blue); transform:translateY(-2px); outline:none}
.ico{flex:none; width:64px; height:64px; border-radius:18px; display:grid; place-items:center; background:#141a38; border:1px solid var(--line); color:var(--blue)}
.ico svg{width:28px; height:28px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.txt{min-width:0; flex:1}
.txt b{display:block; font-size:24px; letter-spacing:-.02em}
.txt small{display:block; margin-top:4px; font:400 15px var(--mono); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.txt small em{font-style:normal; color:var(--blue)}
.go{flex:none; width:42px; height:42px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; color:var(--blue)}
.contact{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.contact a.link{padding:12px; gap:12px; border-radius:22px}
.contact .ico{width:48px; height:48px; border-radius:14px}
.contact .ico svg{width:22px; height:22px}
.contact .txt b{font-size:18px}
.contact .txt small{font-size:13px}
footer{text-align:center; margin-top:14px; font:400 13px var(--mono); color:var(--muted)}
dialog{width:min(92vw,500px); max-height:85vh; padding:24px; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:26px}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 4px; font-size:26px; letter-spacing:-.03em}
dialog h4{margin:20px 0 6px; font:500 13px var(--mono); color:var(--blue)}
dialog p,dialog li{font-size:15px; line-height:1.5; color:#c9cff0}
dialog p{margin:6px 0}
dialog ul{margin:4px 0; padding-left:18px}
dialog .sub{font:400 13px var(--mono); color:var(--muted)}
.proj{margin-top:16px; padding:16px; border:1px solid var(--line); border-radius:18px; background:#0a0e1f}
.ph{display:flex; justify-content:space-between; align-items:center; gap:10px}
.ph b{font-size:19px; letter-spacing:-.02em}
.st{font:500 11px var(--mono); padding:4px 9px; border-radius:99px; border:1px solid; white-space:nowrap}
.st.ok{color:var(--green); border-color:#22c55e66}
.st.wip{color:#f5b942; border-color:#f5b94266}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.tags i{font:400 12px var(--mono); font-style:normal; color:var(--blue); background:#141a38; border:1px solid var(--line); padding:3px 9px; border-radius:8px}
dialog .x{margin-top:22px; width:100%; padding:12px; border-radius:14px; border:1px solid var(--line); background:#141a38; color:var(--text); font:500 15px var(--mono); cursor:pointer}
dialog .x:focus-visible{outline:2px solid var(--blue)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== visual novo ===== */
:root{--bg:#0b100e;--card:#111a16;--line:#29382f;--text:#f4f1e8;--muted:#8fa39a;--blue:#ffb547;--green:#4de1c1;--sans:"Space Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
body{background-image:linear-gradient(#16221c 1px,transparent 1px),linear-gradient(90deg,#16221c 1px,transparent 1px);background-size:32px 32px}
.card{border-radius:14px}
.hero{border-left:4px solid var(--blue)}
h1{letter-spacing:-.03em}
.ico{background:#18241f;border-radius:10px}
.go{border-radius:8px}
a.link:hover,a.link:focus-visible{transform:translateX(4px)}
.contact a.link{border-radius:12px}
.contact .ico{border-radius:9px}
.dot{animation:pulse2 2s ease-in-out infinite}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 0 #4de1c188}50%{box-shadow:0 0 0 10px #4de1c100}}
.wave{display:block;width:100%;height:48px;margin-top:6px;border-top:1px dashed var(--line)}
dialog{border-radius:16px}
.proj{background:#0d1511;border-radius:10px}
.tags i{background:#18241f;border-radius:6px}
dialog .x{background:#18241f;border-radius:10px}
dialog p,dialog li{color:#d6dcd3}
.btn{display:block;margin-top:18px;padding:13px;text-align:center;border-radius:10px;background:var(--blue);color:#1a1100;font:700 15px var(--mono);text-decoration:none}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.enem{padding:18px}
.enem .sub{margin:0 0 14px;font:400 13px var(--mono);color:var(--muted)}
.eg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eg div{padding:12px;border:1px solid var(--line);border-radius:10px;background:#0d1511}
.eg div:only-child{grid-column:1/-1}
.eg small{display:block;font:400 12px var(--mono);color:var(--muted)}
.eg b{display:block;margin-top:4px;font:500 26px var(--mono);color:var(--blue)}
.eg b span{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main>

    <h1 id="n1"></h1>

  <div class="row">
    <div class="card status">
      <div class="tag">// status</div>

    </div>
  </div>

  <h2>// links</h2>
  <nav class="links" id="links"></nav>

  <h2>// resultados</h2>

  <h2>// contato</h2>

async function savePdf(){
  const bin = atob(PDF_B64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const blob = new Blob([u8], {type:"application/pdf"}), name = "Curriculo_Antonio_Magnago_Junior.pdf";
  let d = null;
  try { if (typeof claude !== "undefined") d = await claude.use("downloads"); } catch(e) {}
  if (d) { try { await d.save({filename:name, data:blob}); } catch(e) {} return; }
  const a = document.createElement("a");
a.href = "Curriculo_Antonio_Magnago_Junior.pdf"; a.download = name; a.target = "_blank";
  document.body.appendChild(a); a.click(); a.remove();
}
const dlg = document.getElementById("dlg");
document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener("click", e => {
  e.preventDefault();
  const k = a.getAttribute("href").slice(1);
  if (k === "pdf") { savePdf(); return; }
  if (!MODAL[k]) return;
  document.getElementById("dbody").innerHTML = MODAL[k];
  dlg.showModal();
}));

/* barras do status se mexendo */
const sw = document.getElementById("sw"); let t = 0;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function draw(){
  let d = "";
  for (let x = 0; x <= 300; x += 4) d += (x ? "L" : "M") + x + " " + (24 + 14*Math.sin(x/22 + t) + 5*Math.sin(x/9 - t*1.7)).toFixed(1);
  sw.setAttribute("d", d); t += 0.06;
  if (!still) requestAnimationFrame(draw);
}
draw();

/* digitação da bio */
const el = document.getElementById("role");
let r = 0, i = 0, del = false;
function tick(){
  const w = C.roles[r];
  el.textContent = w.slice(0, i);
  if (!del && i < w.length) { i++; setTimeout(tick, 70); }
  else if (!del) { del = true; setTimeout(tick, 1600); }
  else if (i > 0) { i--; setTimeout(tick, 35); }
  else { del = false; r = (r + 1) % C.roles.length; setTimeout(tick, 300); }
}
tick();
